[package]

# Semantic Versioning is used: https://semver.org/
version = "0.1.0"

# Description
category = "isaaclab"
readme  = "README.md"

title = "AME Stage-1 Reproduction"
author = "Adarsh Jha"
maintainer = "Adarsh Jha"
description = "Unofficial stage-1 reproduction of He et al., \"Attention-based map encoding for learning generalized legged locomotion\" (Science Robotics, 2025), on ANYmal-D in Isaac Lab."
repository = "https://github.com/jha-adarsh18/ame-reproduction"
keywords = ["isaaclab", "locomotion", "anymal"]

[dependencies]
"isaaclab" = {}
"isaaclab_assets" = {}
"isaaclab_mimic" = {}
"isaaclab_rl" = {}
"isaaclab_tasks" = {}
# NOTE: Add additional dependencies here

[[python.module]]
name = "ame_reproduction"

# UI extension module: Kit imports this submodule directly and scans it for ``omni.ext.IExt``
# subclasses. Kept separate from the package root so ``import ame_reproduction`` stays omni-free headless.
[[python.module]]
name = "ame_reproduction.ui_extension_example"

